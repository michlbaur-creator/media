<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital-Quiz – Einsteigerkurs</title>
<style>
  /* Farben wie media.mibaso.de */
  :root{
    --bg:#F7F3E8; --card:#FFFFFF; --ink:#33302B; --muted:#6A645B;
    --line:#E3D8C4; --accent:#3E7CB1; --accent-tief:#2A5C86; --accent-soft:#E8F0F7;
    --wrong:#A8442F; --wrong-soft:#F7E9E4; --shadow:0 2px 10px rgba(0,0,0,.07);
    --fs:1.02rem; --radius:12px;
  }
  @media (min-width:620px){ :root{ --fs:1.15rem; } }
  *{box-sizing:border-box}
  body{
    margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:var(--fs); line-height:1.5;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:760px; margin:0 auto; padding:22px 14px 28px}
  header{margin-bottom:18px}
  h1{font-size:1.15em; margin:0; letter-spacing:-.01em; display:inline}
  .sub{color:var(--muted); font-size:.78em; display:inline; margin-left:6px}
  button{font:inherit; cursor:pointer}
  .ghost{
    background:transparent; color:var(--muted); border:2px solid var(--line);
    border-radius:999px; padding:5px 12px; font-size:.75em;
  }
  .ghost:hover{border-color:var(--accent); color:var(--accent)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px}
  .blocks{display:grid; gap:10px}
  .block{
    display:block; width:100%; text-align:left; background:var(--card); color:var(--ink);
    border:2px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);
  }
  .block:hover{border-color:var(--accent)}
  .block b{display:block; font-size:1.02em}
  .block span{display:block; color:var(--muted); font-size:.8em; margin-top:2px}
  .bar{height:6px; background:var(--line); border-radius:999px; overflow:hidden; margin-bottom:7px}
  .bar>i{display:block; height:100%; background:var(--accent); width:0%; transition:width .3s}
  .meta{display:flex; justify-content:space-between; color:var(--muted); font-size:.75em; margin-bottom:14px}
  .frage{font-size:1.02em; font-weight:600; margin:0 0 14px; line-height:1.4}
  .opts{display:grid; gap:7px}
  .opt{
    display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
    background:var(--card); color:var(--ink); border:2px solid var(--line);
    border-radius:var(--radius); padding:9px 12px; line-height:1.35;
  }
  .opt:hover:not(:disabled){border-color:var(--accent); background:var(--accent-soft)}
  .opt:disabled{cursor:default}
  .key{
    flex:0 0 auto; width:1.6em; height:1.6em; border-radius:50%; background:var(--line); color:var(--ink);
    display:grid; place-items:center; font-size:.78em; font-weight:700; margin-top:.1em;
  }
  .opt.richtig{border-color:var(--accent); background:var(--accent-soft)}
  .opt.richtig .key{background:var(--accent); color:#fff}
  .opt.falsch{border-color:var(--wrong); background:var(--wrong-soft)}
  .opt.falsch .key{background:var(--wrong); color:#fff}
  .fb{margin-top:10px; padding:10px 12px; border-radius:var(--radius); background:var(--accent-soft); border-left:5px solid var(--accent)}
  .fb.nein{background:var(--wrong-soft); border-left-color:var(--wrong)}
  .fb b{display:block; margin-bottom:2px; font-size:.95em}
  .fb p{margin:0; font-size:.86em; line-height:1.4}
  .weiter{
    position:sticky; bottom:calc(8px + env(safe-area-inset-bottom,0px)); z-index:5;
    margin-top:10px; width:100%; background:var(--accent); color:#fff; border:none;
    border-radius:var(--radius); padding:13px; font-size:.98em; font-weight:600;
    box-shadow:0 3px 14px rgba(0,0,0,.18);
  }
  .weiter:hover{filter:brightness(1.08)}
  .score{font-size:2.2em; font-weight:700; color:var(--accent); margin:4px 0}
  .zentriert{text-align:center}
  .row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:14px}
  .row button{border-radius:var(--radius); padding:10px 16px; font-size:.85em; border:2px solid var(--line); background:transparent; color:var(--ink)}
  .row button.prim{background:var(--accent); color:#fff; border-color:var(--accent)}
  footer{text-align:center; color:var(--muted); font-size:.75em; margin-top:16px}
  .hinweis{color:var(--muted); font-size:.8em; margin-top:8px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Digital-Quiz</h1><span class="sub">Einsteigerkurs – Internet verstehen</span>
  </header>

  <!-- Startbildschirm -->
  <section id="start">
    <div class="card">
      <p style="margin:0 0 6px">Testen Sie in Ruhe, was hängengeblieben ist. Nach jeder Antwort kommt sofort die Erklärung – falsch antworten ist hier ausdrücklich erlaubt.</p>
      <p class="hinweis">Am Beamer: mit den Tasten 1 bis 4 antworten, mit der Leertaste weiterblättern.</p>
    </div>
    <div class="blocks" id="blockListe"></div>
  </section>

  <!-- Quiz -->
  <section id="quiz" hidden>
    <div class="bar"><i id="fortschritt"></i></div>
    <div class="meta"><span id="zaehler"></span><span id="punkte"></span></div>
    <div class="card">
      <p class="frage" id="frage"></p>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb" hidden><b id="fbTitel"></b><p id="fbText"></p></div>
      <button class="weiter" id="weiter" type="button" hidden>Weiter</button>
    </div>
    <div class="zentriert"><button class="ghost" id="abbruch" type="button">Zurück zur Übersicht</button></div>
  </section>

  <!-- Ergebnis -->
  <section id="ende" hidden>
    <div class="card zentriert">
      <div id="ergebnisTitel" style="font-weight:600"></div>
      <div class="score" id="ergebnisPunkte"></div>
      <p id="ergebnisText" style="color:var(--muted); font-size:.86em; margin:0"></p>
      <div class="row">
        <button class="prim" id="nochmal" type="button">Nochmal üben</button>
        <button id="zurueck" type="button">Anderes Thema</button>
      </div>
    </div>
  </section>

  <footer><a href="/#quizze" style="color:var(--accent)">← Zurück zu Media Mibaso</a></footer>
</div>

<script>
const BLOECKE = [
  {
    id: "grundlagen",
    titel: "Wie das Internet funktioniert",
    unter: "Netz, Router, Provider, Cloud – 10 Fragen",
    fragen: [
      {
        f: "Das Wort „Internet“ ist eine Abkürzung. Wofür steht es?",
        a: ["Interconnected Network – ein weltweit ineinandergreifendes Netzwerk",
            "International Netbook – die erste Generation tragbarer Computer",
            "Interner Nachrichtendienst der Universitäten",
            "Intelligentes Netz, das sich selbst verwaltet"],
        r: 0,
        e: "Inter + connected + Network. Im Deutschen sagen wir meist einfach „Netz“ oder „Web“."
      },
      {
        f: "Wer stellte 1989 das World Wide Web vor?",
        a: ["Tim Berners-Lee", "Bill Gates", "Steve Jobs", "Mark Zuckerberg"],
        r: 0,
        e: "Tim Berners-Lee entwickelte die Bausteine HTML, HTTP, die Internetadressen (URL) sowie den ersten Browser und Webserver."
      },
      {
        f: "Wie reisen Ihre Daten durchs Internet?",
        a: ["In vielen kleinen Paketen, die sich unterschiedliche Wege suchen",
            "Als ein einziger großer Block auf einer festen Leitung",
            "Über Funkwellen direkt vom Absender zum Empfänger",
            "Sie werden auf Servern zwischengelagert und nachts verschickt"],
        r: 0,
        e: "Die Daten werden zerlegt wie ein Puzzle. Jedes Paket nimmt seinen eigenen Weg – so gibt es keine Staus. Am Ziel werden sie wieder korrekt zusammengesetzt."
      },
      {
        f: "Was macht der Router, der bei Ihnen zu Hause steht – zum Beispiel eine Fritzbox?",
        a: ["Er verteilt die ankommenden Daten auf Ihre Geräte",
            "Er speichert alle Ihre Fotos und E-Mails",
            "Er verschlüsselt automatisch jede Nachricht",
            "Er ersetzt den Vertrag mit dem Telefonanbieter"],
        r: 0,
        e: "Der Router ist der Verkehrsmanager: Er verbindet Netzwerke und schickt jedes Datenpaket an das richtige Gerät – Laptop, Smartphone, Drucker, Smart-TV."
      },
      {
        f: "Welche Rolle hat ein Provider wie Telekom, Vodafone oder 1&1?",
        a: ["Er stellt überhaupt erst die Verbindung ins Internet bereit",
            "Er baut die Router und Smartphones",
            "Er prüft die Internetseiten auf ihren Wahrheitsgehalt",
            "Er verwaltet die Passwörter seiner Kunden"],
        r: 0,
        e: "Der Provider (Dienstanbieter) ist die Brücke zum Internet – meistens ist er zugleich der Telefonanbieter."
      },
      {
        f: "Was ist der Unterschied zwischen LAN und WLAN?",
        a: ["LAN läuft über Kabel, WLAN drahtlos per Funk",
            "LAN ist für Firmen, WLAN nur für Privathaushalte",
            "WLAN ist immer schneller als LAN",
            "LAN ist das weltweite Netz, WLAN das deutsche"],
        r: 0,
        e: "Beides ist ein örtliches Netzwerk. Kabel bedeutet stabil und schnell, Funk bedeutet Bewegungsfreiheit – praktisch für Smartphone und Tablet."
      },
      {
        f: "Wofür ist ein Mesh-WLAN gedacht?",
        a: ["Mehrere Geräte spannen gemeinsam ein Netz ohne Funklöcher auf",
            "Es verschlüsselt das WLAN besonders stark",
            "Es begrenzt den Datenverbrauch der Kinder",
            "Es ersetzt den Internetanschluss durch Satellit"],
        r: 0,
        e: "Mehrere Router arbeiten zusammen und melden jedes Gerät automatisch beim besten Knotenpunkt an. Ideal für große Wohnungen und Häuser mit dicken Wänden."
      },
      {
        f: "Was steckt hinter dem Begriff „Cloud“?",
        a: ["Ihre Dateien liegen auf fremden Servern und sind auf allen Geräten aktuell",
            "Ein besonders großer Speicher im eigenen Computer",
            "Ein Programm, das das Internet schneller macht",
            "Die drahtlose Verbindung zwischen Handy und Router"],
        r: 0,
        e: "Bekannte Anbieter sind Google Drive, iCloud, Dropbox und OneDrive. Vorteil: Zugriff von überall und automatische Sicherung. Kehrseite: Die Daten liegen bei einer fremden Firma."
      },
      {
        f: "Was kann ein Smartphone, was ein einfaches Handy nicht kann?",
        a: ["Ins Internet gehen, Apps nutzen, fotografieren und navigieren",
            "Telefonieren und SMS schreiben",
            "Einen Akku aufladen",
            "Eine SIM-Karte aufnehmen"],
        r: 0,
        e: "Telefonieren und SMS können beide. Das Smartphone ist darüber hinaus ein kleiner Computer mit Internet, Apps, Kamera und Navigation."
      },
      {
        f: "Wie viel des weltweiten Stromverbrauchs geht ungefähr auf das Konto des Internets?",
        a: ["Etwa 8 bis 10 Prozent", "Weniger als 1 Prozent", "Etwa 30 Prozent", "Rund die Hälfte"],
        r: 0,
        e: "Rund 2000 bis 3000 Terawattstunden im Jahr. Die IT-Branche verursacht über 3 Prozent der Treibhausgase – mehr als der gesamte Flugverkehr mit etwa 2 Prozent."
      }
    ]
  },
  {
    id: "begriffe",
    titel: "Begriffe, die ständig auftauchen",
    unter: "App, Account, Bluetooth, Hotspot & Co. – 10 Fragen",
    fragen: [
      {
        f: "Das Wort „App“ ist die Kurzform von …",
        a: ["Application, also Anwendung oder Programm",
            "Apparat, also das Gerät selbst",
            "Approved Program, also geprüftes Programm",
            "Apple Programm"],
        r: 0,
        e: "Apps holen Sie sich im Google Play Store (Android) oder im App Store (Apple). Viele sind kostenlos – bezahlt wird dann oft mit Werbung oder mit Ihren Daten."
      },
      {
        f: "Was ist ein Account?",
        a: ["Ihr persönliches Benutzerkonto bei einem Dienst",
            "Die Rechnung, die am Monatsende kommt",
            "Ein besonders sicheres Passwort",
            "Der Speicherplatz auf Ihrem Handy"],
        r: 0,
        e: "Zugang nur mit Benutzername und Passwort. Der Benutzername ist meistens Ihre E-Mail-Adresse."
      },
      {
        f: "Wofür wird Bluetooth verwendet?",
        a: ["Zum Verbinden zweier Geräte über kurze Entfernung, etwa mit der Freisprechanlage im Auto",
            "Für den Internetzugang unterwegs",
            "Zum Aufladen des Handys ohne Kabel",
            "Zum Sichern der Fotos in der Cloud"],
        r: 0,
        e: "Bluetooth ist Funk auf kurze Distanz – für Kopfhörer, Lautsprecher, Autoradio oder die Smartwatch. Einschalten lässt es sich in den Einstellungen."
      },
      {
        f: "Was ist der Homescreen?",
        a: ["Der Startbildschirm, der nach dem Einschalten erscheint",
            "Das Display eines Fernsehers",
            "Die Startseite des Browsers",
            "Der Sperrbildschirm mit der Uhrzeit"],
        r: 0,
        e: "Den Startbildschirm können Sie ganz nach Ihrem Geschmack einrichten – und sich sogar mehrere davon anlegen."
      },
      {
        f: "Was ist ein Hotspot?",
        a: ["Ein WLAN-Zugangspunkt, über den Geräte ins Internet kommen",
            "Eine besonders warme Stelle am Akku",
            "Ein Werbefenster in einer App",
            "Der Ort mit dem besten Handyempfang im Haus"],
        r: 0,
        e: "Es gibt öffentliche Hotspots, etwa im Café, und private. Auch Ihr Smartphone kann selbst zum Hotspot werden und zum Beispiel den Laptop mit ins Netz nehmen."
      },
      {
        f: "Was zeichnet eine PDF-Datei aus?",
        a: ["Sie zeigt den Inhalt originalgetreu, so wie er gedacht war",
            "Sie lässt sich in jedem Programm beliebig umschreiben",
            "Sie enthält immer nur Bilder",
            "Sie kann nur am Computer geöffnet werden, nicht am Handy"],
        r: 0,
        e: "PDF steht für Portable Document Format. Layout und Schrift bleiben auf jedem Gerät gleich. Zum Lesen genügt ein PDF-Reader, den jedes Smartphone mitbringt."
      },
      {
        f: "Was passiert im Flugzeugmodus?",
        a: ["Alle Funkverbindungen werden abgeschaltet, das Gerät bleibt aber an",
            "Das Handy schaltet sich vollständig aus",
            "Nur das WLAN wird abgeschaltet",
            "Alle Apps werden beendet und gelöscht"],
        r: 0,
        e: "Praktisch auch nachts: Telefon und Internet sind still, der Wecker klingelt trotzdem."
      },
      {
        f: "Welche Aufgabe hat die SIM-Karte?",
        a: ["Sie weist Ihr Gerät im Mobilfunknetz aus",
            "Sie speichert Ihre Fotos und Videos",
            "Sie sorgt für den WLAN-Empfang zu Hause",
            "Sie lädt den Akku schneller"],
        r: 0,
        e: "SIM heißt Subscriber Identification Module – Teilnehmer-Erkennung. Geschützt ist sie durch die PIN, die Sie jederzeit ändern können."
      },
      {
        f: "Was ist ein Widget?",
        a: ["Ein kleines Fenster auf dem Startbildschirm, etwa Wetter oder Uhr",
            "Ein besonders kleines Smartphone",
            "Ein Schutzprogramm gegen Viren",
            "Ein Stecker für den Kopfhörer"],
        r: 0,
        e: "Widgets zeigen eine Funktion einer App direkt auf dem Startbildschirm – Wetter, Uhr, Taschenlampe, Taschenrechner oder die Nachrichten."
      },
      {
        f: "Was bedeutet Display-Timeout?",
        a: ["Der Bildschirm wird nach einer eingestellten Zeit von allein dunkel",
            "Das Gerät ist defekt und muss neu gestartet werden",
            "Der Akku ist leer",
            "Die Internetverbindung ist abgelaufen"],
        r: 0,
        e: "Das spart Strom und schützt vor versehentlichen Berührungen. Wie lange es dauert, stellen Sie in den Einstellungen selbst ein."
      }
    ]
  }
];

const LOB = [
  { ab: 10, t: "Ganz ausgezeichnet!", s: "Das sitzt. Sie könnten den Kurs fast selbst geben." },
  { ab: 8,  t: "Sehr gut gemacht!",   s: "Der Stoff ist angekommen – nur ein paar Kleinigkeiten zum Nachlesen." },
  { ab: 6,  t: "Gut dabei!",          s: "Die Hälfte und mehr sitzt schon. Ein zweiter Durchgang lohnt sich." },
  { ab: 0,  t: "Ein guter Anfang.",   s: "Kein Grund zur Sorge – gehen Sie es in Ruhe noch einmal durch." }
];

const $ = id => document.getElementById(id);
let block = null, i = 0, richtig = 0, beantwortet = false, reihenfolge = [];

// Antwortreihenfolge mischen, damit die richtige Lösung nicht immer oben steht
function mische(n){
  const a = [...Array(n).keys()];
  for (let k = a.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}

// Startbildschirm aufbauen
BLOECKE.forEach((b, n) => {
  const btn = document.createElement("button");
  btn.className = "block";
  btn.type = "button";
  btn.innerHTML = "<b>" + b.titel + "</b><span>" + b.unter + "</span>";
  btn.addEventListener("click", () => starte(n));
  $("blockListe").appendChild(btn);
});

function zeige(welche){
  ["start","quiz","ende"].forEach(s => $(s).hidden = (s !== welche));
  window.scrollTo(0, 0);
}

function starte(n){
  block = BLOECKE[n];
  i = 0; richtig = 0;
  zeige("quiz");
  frage();
}

function frage(){
  beantwortet = false;
  const q = block.fragen[i];
  $("frage").textContent = q.f;
  $("zaehler").textContent = "Frage " + (i + 1) + " von " + block.fragen.length;
  $("punkte").textContent = richtig + " richtig";
  $("fortschritt").style.width = (i / block.fragen.length * 100) + "%";
  $("fb").hidden = true;
  $("weiter").hidden = true;

  const opts = $("opts");
  opts.textContent = "";
  reihenfolge = mische(q.a.length);
  reihenfolge.forEach((orig, k) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    b.dataset.orig = orig;
    const key = document.createElement("span");
    key.className = "key";
    key.textContent = k + 1;
    const txt = document.createElement("span");
    txt.textContent = q.a[orig];
    b.append(key, txt);
    b.addEventListener("click", () => antworte(orig));
    opts.appendChild(b);
  });
}

function antworte(orig){
  if (beantwortet) return;
  beantwortet = true;
  const q = block.fragen[i];
  const istRichtig = (orig === q.r);
  if (istRichtig) richtig++;

  [...$("opts").children].forEach(b => {
    b.disabled = true;
    const nr = Number(b.dataset.orig);
    if (nr === q.r) b.classList.add("richtig");
    else if (nr === orig) b.classList.add("falsch");
  });

  $("fb").hidden = false;
  $("fb").classList.toggle("nein", !istRichtig);
  $("fbTitel").textContent = istRichtig ? "Richtig." : "Nicht ganz.";
  $("fbText").textContent = q.e;
  $("punkte").textContent = richtig + " richtig";
  $("weiter").hidden = false;
  $("weiter").textContent = (i + 1 < block.fragen.length) ? "Weiter" : "Ergebnis anzeigen";
  $("weiter").focus({ preventScroll: true });
}

function weiter(){
  if (!beantwortet) return;
  i++;
  if (i < block.fragen.length) frage();
  else ergebnis();
}

function ergebnis(){
  const n = block.fragen.length;
  const lob = LOB.find(l => richtig >= l.ab);
  $("ergebnisTitel").textContent = lob.t;
  $("ergebnisPunkte").textContent = richtig + " von " + n;
  $("ergebnisText").textContent = lob.s;
  $("fortschritt").style.width = "100%";
  zeige("ende");
}

$("weiter").addEventListener("click", weiter);
$("abbruch").addEventListener("click", () => zeige("start"));
$("zurueck").addEventListener("click", () => zeige("start"));
$("nochmal").addEventListener("click", () => starte(BLOECKE.indexOf(block)));

// Tastatur: 1–4 antworten, Leertaste/Enter weiter
document.addEventListener("keydown", e => {
  if ($("quiz").hidden) return;
  if (e.key >= "1" && e.key <= "4" && !beantwortet){
    const b = $("opts").children[Number(e.key) - 1];
    if (b) { e.preventDefault(); b.click(); }
  } else if ((e.key === " " || e.key === "Enter") && beantwortet){
    e.preventDefault(); weiter();
  }
});
</script>
</body>
</html>
