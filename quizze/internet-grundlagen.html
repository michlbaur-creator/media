<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital-Quiz – Einsteigerkurs</title>
<style>
  /* Farben wie media.mibaso.de */
  :root{
    --bg:#F7F3E8; --card:#FFFFFF; --ink:#33302B; --muted:#6A645B;
    --line:#E3D8C4; --accent:#3E7CB1; --accent-tief:#2A5C86; --accent-soft:#E8F0F7;
    --wrong:#A8442F; --wrong-soft:#F7E9E4; --shadow:0 2px 10px rgba(0,0,0,.07);
    --fs:1.14rem; --radius:12px;
  }
  @media (min-width:620px){ :root{ --fs:1.25rem; } }
  *{box-sizing:border-box}
  body{
    margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:var(--fs); line-height:1.5;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:760px; margin:0 auto; padding:26px 14px 30px}
  body.mit-leiste .wrap{padding-bottom:110px}
  header{margin-bottom:20px}
  h1{font-size:1.15em; margin:0; letter-spacing:-.01em; display:inline}
  .sub{color:var(--muted); font-size:.78em; display:inline; margin-left:6px}
  button{font:inherit; cursor:pointer}
  .ghost{
    background:transparent; color:var(--muted); border:2px solid var(--line);
    border-radius:999px; padding:5px 12px; font-size:.75em;
  }
  .ghost:hover{border-color:var(--accent); color:var(--accent)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px}
  .blocks{display:grid; gap:10px}
  .block{
    display:block; width:100%; text-align:left; background:var(--card); color:var(--ink);
    border:2px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);
  }
  .block:hover{border-color:var(--accent)}
  .block b{display:block; font-size:1.02em}
  .block span{display:block; color:var(--muted); font-size:.8em; margin-top:2px}
  .bar{height:6px; background:var(--line); border-radius:999px; overflow:hidden; margin-bottom:7px}
  .bar>i{display:block; height:100%; background:var(--accent); width:0%; transition:width .3s}
  .meta{display:flex; justify-content:space-between; color:var(--muted); font-size:.75em; margin-bottom:14px}
  .frage{font-size:1.02em; font-weight:600; margin:0 0 14px; line-height:1.4}
  .opts{display:grid; gap:7px}
  .opt{
    display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
    background:var(--card); color:var(--ink); border:2px solid var(--line);
    border-radius:var(--radius); padding:9px 12px; line-height:1.35;
  }
  .opt:hover:not(:disabled){border-color:var(--accent); background:var(--accent-soft)}
  .opt:disabled{cursor:default}
  .key{
    flex:0 0 auto; width:1.6em; height:1.6em; border-radius:50%; background:var(--line); color:var(--ink);
    display:grid; place-items:center; font-size:.78em; font-weight:700; margin-top:.1em;
  }
  .opt.richtig{border-color:var(--accent); background:var(--accent-soft)}
  .opt.richtig .key{background:var(--accent); color:#fff}
  .opt.falsch{border-color:var(--wrong); background:var(--wrong-soft)}
  .opt.falsch .key{background:var(--wrong); color:#fff}
  .fb{margin-top:10px; padding:10px 12px; border-radius:var(--radius); background:var(--accent-soft); border-left:5px solid var(--accent)}
  .fb.nein{background:var(--wrong-soft); border-left-color:var(--wrong)}
  .fb b{display:block; margin-bottom:2px; font-size:.95em}
  .fb p{margin:0; font-size:.86em; line-height:1.4}
  /* Feste Leiste am unteren Bildschirmrand – der Rest scrollt darunter durch */
  .leiste{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--bg); border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -4px 18px rgba(0,0,0,.10);
  }
  .weiter{
    display:block; max-width:760px; margin:0 auto; width:100%;
    background:var(--accent); color:#fff; border:none;
    border-radius:var(--radius); padding:14px; font-size:1em; font-weight:600;
  }
  .weiter:hover{filter:brightness(1.08)}
  .score{font-size:2.2em; font-weight:700; color:var(--accent); margin:4px 0}
  .zentriert{text-align:center}
  .row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:14px}
  .row button{border-radius:var(--radius); padding:10px 16px; font-size:.85em; border:2px solid var(--line); background:transparent; color:var(--ink)}
  .row button.prim{background:var(--accent); color:#fff; border-color:var(--accent)}
  #feuerwerk{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50}
  .jubel{display:block; font-size:1.6em; margin-bottom:2px}
  footer{text-align:center; color:var(--muted); font-size:.75em; margin-top:16px}
  .hinweis{color:var(--muted); font-size:.8em; margin-top:8px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Digital-Quiz</h1><span class="sub">Einsteigerkurs – Internet verstehen</span>
  </header>

  <!-- Startbildschirm -->
  <section id="start">
    <div class="card">
      <p style="margin:0 0 6px">Teste in Ruhe, was hängengeblieben ist. Nach jeder Antwort kommt sofort die Erklärung – falsch antworten ist hier ausdrücklich erlaubt.</p>
      <p class="hinweis">Am Beamer: mit den Tasten 1 bis 4 antworten, mit der Leertaste weiterblättern.</p>
    </div>
    <div class="blocks" id="blockListe"></div>
  </section>

  <!-- Quiz -->
  <section id="quiz" hidden>
    <div class="bar"><i id="fortschritt"></i></div>
    <div class="meta"><span id="zaehler"></span><span id="punkte"></span></div>
    <div class="card">
      <p class="frage" id="frage"></p>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb" hidden><b id="fbTitel"></b><p id="fbText"></p></div>
    </div>
    <div class="zentriert"><button class="ghost" id="abbruch" type="button">Zurück zur Übersicht</button></div>
  </section>

  <!-- Ergebnis -->
  <section id="ende" hidden>
    <div class="card zentriert">
      <span class="jubel" id="jubel" hidden>🎉</span>
    <div id="ergebnisTitel" style="font-weight:600"></div>
      <div class="score" id="ergebnisPunkte"></div>
      <p id="ergebnisText" style="color:var(--muted); font-size:.86em; margin:0"></p>
      <div class="row">
        <button class="prim" id="nochmal" type="button">Nochmal üben</button>
        <button id="zurueck" type="button">Anderes Thema</button>
      </div>
    </div>
  </section>

  <footer><a href="/#quizze" style="color:var(--accent)">← Zurück zu Media Mibaso</a></footer>
</div>

<div class="leiste" id="leiste" hidden>
  <button class="weiter" id="weiter" type="button">Weiter</button>
</div>

<canvas id="feuerwerk" hidden></canvas>

const LOB = [
  { ab: 8, t: "Fast alles!",            s: "Da fehlt nur ein Krümel. Noch eine Runde, dann sitzt auch der Rest." },
  { ab: 6, t: "Sauber!",                s: "Mehr als die Hälfte im Kasten – der Rest kommt beim zweiten Durchgang fast von allein." },
  { ab: 4, t: "Geht doch!",             s: "Die halbe Miete ist drin. Wiederholen ist hier keine Schande, sondern die Methode." },
  { ab: 0, t: "Ein Anfang ist gemacht.", s: "Kein Grund zur Sorge – auch das Internet wurde nicht an einem Tag verstanden." }
];

// Sprüche für die volle Punktzahl – einer wird ausgelost
const JUBEL = [
  "Zehn von zehn. Die Urkunde kommt per Rauchzeichen.",
  "Alles richtig! Nächste Woche stellst du dich vorne hin und ich setze mich.",
  "Fehlerfrei durch – das Internet verneigt sich.",
  "Volle Punktzahl. Das riecht ganz nach einem Stück Kuchen zur Feier.",
  "Keine einzige daneben. Wer hat dir das denn alles beigebracht?"
];

const $ = id => document.getElementById(id);
let block = null, i = 0, richtig = 0, beantwortet = false, reihenfolge = [];

// Antwortreihenfolge mischen, damit die richtige Lösung nicht immer oben steht
function mische(n){
  const a = [...Array(n).keys()];
  for (let k = a.length - 1; k > 0; k--){
    const j = Math.floor(Math.random() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}

// Startbildschirm aufbauen
BLOECKE.forEach((b, n) => {
  const btn = document.createElement("button");
  btn.className = "block";
  btn.type = "button";
  btn.innerHTML = "<b>" + b.titel + "</b><span>" + b.unter + "</span>";
  btn.addEventListener("click", () => starte(n));
  $("blockListe").appendChild(btn);
});

function leisteZeigen(an){
  $("leiste").hidden = !an;
  document.body.classList.toggle("mit-leiste", an);
}

function zeige(welche){
  ["start","quiz","ende"].forEach(s => $(s).hidden = (s !== welche));
  if (welche !== "quiz") leisteZeigen(false);
  window.scrollTo(0, 0);
}

function starte(n){
  block = BLOECKE[n];
  i = 0; richtig = 0;
  zeige("quiz");
  frage();
}

function frage(){
  beantwortet = false;
  const q = block.fragen[i];
  $("frage").textContent = q.f;
  $("zaehler").textContent = "Frage " + (i + 1) + " von " + block.fragen.length;
  $("punkte").textContent = richtig + " richtig";
  $("fortschritt").style.width = (i / block.fragen.length * 100) + "%";
  $("fb").hidden = true;
  leisteZeigen(false);

  const opts = $("opts");
  opts.textContent = "";
  reihenfolge = mische(q.a.length);
  reihenfolge.forEach((orig, k) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    b.dataset.orig = orig;
    const key = document.createElement("span");
    key.className = "key";
    key.textContent = k + 1;
    const txt = document.createElement("span");
    txt.textContent = q.a[orig];
    b.append(key, txt);
    b.addEventListener("click", () => antworte(orig));
    opts.appendChild(b);
  });
}

function antworte(orig){
  if (beantwortet) return;
  beantwortet = true;
  const q = block.fragen[i];
  const istRichtig = (orig === q.r);
  if (istRichtig) richtig++;

  [...$("opts").children].forEach(b => {
    b.disabled = true;
    const nr = Number(b.dataset.orig);
    if (nr === q.r) b.classList.add("richtig");
    else if (nr === orig) b.classList.add("falsch");
  });

  $("fb").hidden = false;
  $("fb").classList.toggle("nein", !istRichtig);
  $("fbTitel").textContent = istRichtig ? "Richtig." : "Nicht ganz.";
  $("fbText").textContent = q.e;
  $("punkte").textContent = richtig + " richtig";
  $("weiter").textContent = (i + 1 < block.fragen.length) ? "Weiter" : "Ergebnis anzeigen";
  leisteZeigen(true);
  $("weiter").focus({ preventScroll: true });
  // Erklärung sanft ins Bild holen, falls sie hinter der Leiste verschwindet
  try {
    const kasten = $("fb").getBoundingClientRect();
    const frei = window.innerHeight - $("leiste").offsetHeight - 10;
    const fehlt = kasten.bottom - frei;
    if (fehlt > 0) window.scrollBy({ top: fehlt, behavior: "smooth" });
  } catch(e){}
}

function weiter(){
  if (!beantwortet) return;
  i++;
  if (i < block.fragen.length) frage();
  else ergebnis();
}

function ergebnis(){
  const n = block.fragen.length;
  const lob = LOB.find(l => richtig >= l.ab);
  const alles = (richtig === n);
  $("ergebnisTitel").textContent = alles ? "Volltreffer!" : lob.t;
  $("ergebnisPunkte").textContent = richtig + " von " + n;
  $("ergebnisText").textContent = alles ? JUBEL[Math.floor(Math.random() * JUBEL.length)] : lob.s;
  $("jubel").hidden = !alles;
  $("fortschritt").style.width = "100%";
  zeige("ende");
  if (alles) { fanfare(); feuerwerk(); }
}

/* ---------- Belohnung bei voller Punktzahl ---------- */

// Fanfare, ganz ohne Tondatei: vier Töne und ein Schlussakkord
function fanfare(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    const summe = ctx.createGain();
    summe.gain.value = 0.9;
    summe.connect(ctx.destination);

    function ton(hz, start, dauer, laut){
      const t = ctx.currentTime + start;
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 2600;
      const huelle = ctx.createGain();
      huelle.gain.setValueAtTime(0.0001, t);
      huelle.gain.exponentialRampToValueAtTime(laut, t + 0.03);
      huelle.gain.setValueAtTime(laut, t + dauer * 0.6);
      huelle.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
      filter.connect(huelle); huelle.connect(summe);
      [0, 6].forEach(verstimmung => {        // zwei Stimmen = voller Klang
        const o = ctx.createOscillator();
        o.type = "sawtooth";
        o.frequency.value = hz;
        o.detune.value = verstimmung;
        o.connect(filter);
        o.start(t); o.stop(t + dauer + 0.05);
      });
    }

    const C5=523.25, E5=659.25, G5=783.99, C6=1046.50;
    ton(C5, 0.00, 0.16, 0.22);
    ton(E5, 0.16, 0.16, 0.22);
    ton(G5, 0.32, 0.16, 0.22);
    ton(C6, 0.50, 0.75, 0.26);
    ton(G5, 0.50, 0.75, 0.13);
    [C5, E5, G5, C6].forEach(h => ton(h, 1.35, 1.10, 0.15));

    setTimeout(() => { try{ ctx.close(); }catch(e){} }, 3200);
  }catch(e){}
}

// Feuerwerk: mehrere Raketen, die am Himmel zerplatzen
function feuerwerk(){
  const leinwand = $("feuerwerk");
  if (!leinwand || !leinwand.getContext) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const stift = leinwand.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const breite = window.innerWidth, hoehe = window.innerHeight;
  leinwand.width = breite * dpr; leinwand.height = hoehe * dpr;
  stift.setTransform(dpr, 0, 0, dpr, 0, 0);
  leinwand.hidden = false;

  const FARBEN = ["#3E7CB1","#C28A3A","#B23B2E","#2C7A6A","#E8C15A","#7FB3D8"];
  let funken = [];

  function knall(x, y){
    const farbe = FARBEN[Math.floor(Math.random() * FARBEN.length)];
    const anzahl = 46;
    for (let k = 0; k < anzahl; k++){
      const winkel = (Math.PI * 2 * k) / anzahl + Math.random() * 0.2;
      const tempo = 2.2 + Math.random() * 3.0;
      funken.push({
        x, y,
        vx: Math.cos(winkel) * tempo,
        vy: Math.sin(winkel) * tempo,
        farbe, leben: 1, gross: 1.6 + Math.random() * 1.8
      });
    }
  }

  // Erste Salve sofort, dann noch ein paar verteilt
  knall(breite * 0.5, hoehe * 0.32);
  const zeitpunkte = [350, 700, 1050, 1450, 1800];
  const uhren = zeitpunkte.map(ms => setTimeout(
    () => knall(breite * (0.15 + Math.random() * 0.7), hoehe * (0.18 + Math.random() * 0.35)), ms));

  const ende = performance.now() + 3400;
  function bild(jetzt){
    stift.clearRect(0, 0, breite, hoehe);
    funken.forEach(f => {
      f.x += f.vx; f.y += f.vy;
      f.vy += 0.055;          // Schwerkraft
      f.vx *= 0.985; f.vy *= 0.985;
      f.leben -= 0.011;
      if (f.leben > 0){
        stift.globalAlpha = Math.max(f.leben, 0);
        stift.fillStyle = f.farbe;
        stift.beginPath();
        stift.arc(f.x, f.y, f.gross, 0, Math.PI * 2);
        stift.fill();
      }
    });
    funken = funken.filter(f => f.leben > 0);
    stift.globalAlpha = 1;
    if (jetzt < ende || funken.length) requestAnimationFrame(bild);
    else { stift.clearRect(0, 0, breite, hoehe); leinwand.hidden = true; }
  }
  requestAnimationFrame(bild);

  // Beim Verlassen der Ergebnisseite aufräumen
  ["nochmal","zurueck"].forEach(id => $(id).addEventListener("click", function aufraeumen(){
    uhren.forEach(clearTimeout);
    funken = [];
    stift.clearRect(0, 0, breite, hoehe);
    leinwand.hidden = true;
    $(id).removeEventListener("click", aufraeumen);
  }));
}

$("weiter").addEventListener("click", weiter);
$("abbruch").addEventListener("click", () => zeige("start"));
$("zurueck").addEventListener("click", () => zeige("start"));
$("nochmal").addEventListener("click", () => starte(BLOECKE.indexOf(block)));

// Tastatur: 1–4 antworten, Leertaste/Enter weiter
document.addEventListener("keydown", e => {
  if ($("quiz").hidden) return;
  if (e.key >= "1" && e.key <= "4" && !beantwortet){
    const b = $("opts").children[Number(e.key) - 1];
    if (b) { e.preventDefault(); b.click(); }
  } else if ((e.key === " " || e.key === "Enter") && beantwortet){
    e.preventDefault(); weiter();
  }
});
